            "active",

                ${
                    card.flavor_text
                    ? `

                    <div class="detail-row">

                        <span class="detail-label">
                            Flavor Text
                        </span>

                        <div class="detail-value">

                            <i>
                                ${card.flavor_text}
                            </i>

                        </div>

                    </div>

                    `
                    : ""
                }


                ${
                    card.power !== null &&
                    card.toughness !== null
                    ? `

                    <div class="detail-row">

                        <span class="detail-label">
                            Forza / Costituzione
                        </span>

                        <div class="detail-value">

                            ${card.power}
                            /
                            ${card.toughness}

                        </div>

                    </div>

                    `
                    : ""
                }


                ${
                    card.artist
                    ? `

                    <div class="detail-row">

                        <span class="detail-label">
                            Artista
                        </span>

                        <div class="detail-value">
                            ${card.artist}
                        </div>

                    </div>

                    `
                    : ""
                }


                ${
                    card.needs_review
                    ? `

                    <div class="review-warning">

                        ⚠ Questa carta necessita
                        di revisione.

                    </div>

                    `
                    : ""
                }

            </div>

        </div>

    `;


    document
        .getElementById("cardModal")
        .style.display = "flex";

}


function closeCardModal() {

    document
        .getElementById("cardModal")
        .style.display = "none";

}


document
    .getElementById("cardModal")
    .addEventListener("click", event => {

        if (event.target.id === "cardModal") {

            closeCardModal();

        }

    });


document.addEventListener("keydown", event => {

    if (event.key === "Escape") {

        closeCardModal();

    }

});

</script>

</body>

</html>
